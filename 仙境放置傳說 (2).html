<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙境放置傳說</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdf3de;--card:#fffaf0;--tx:#3a2a1a;--mut:#8a7660;--ac:#e0603a;--bd:#e6d3ad;--hp:#e5484d;--mp:#3b82f6;--xp:#f5a524;--st:#dff1d0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1510;--card:#262017;--tx:#f1e6d2;--mut:#a8977c;--bd:#3d3326;--st:#26361f}}
:root[data-theme="dark"]{--bg:#1a1510;--card:#262017;--tx:#f1e6d2;--mut:#a8977c;--bd:#3d3326;--st:#26361f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;min-height:100%}
#app{max-width:1000px;margin:0 auto;padding:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
h1{font-size:18px;margin:0 0 6px}.mut{color:var(--mut);font-size:13px}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;max-width:100%}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;position:relative;margin:3px 0}.bar i{display:block;height:100%;transition:width .3s}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grid{display:grid;gap:10px}@media(min-width:760px){.grid{grid-template-columns:1.2fr 1fr}}
#stage{height:130px;border-radius:12px;background:linear-gradient(#bfe6ff,var(--st) 70%);position:relative;overflow:hidden;color:#3a2a1a}
.sp1{position:absolute;bottom:20px;text-align:center;width:120px}.sp1 b{font-size:54px;display:flex;height:56px;align-items:flex-end;justify-content:center}.spr{vertical-align:middle;max-width:100%}#stage.town{background:linear-gradient(#ffd9a8,#e8cfa0 70%)}#stage.town::before{content:"🏰　⛲　🏠";position:absolute;top:6px;left:0;right:0;text-align:center;font-size:24px;opacity:.7}.ft{font-size:12px;color:var(--mut);line-height:1.5}
#me{left:12%}#en{right:12%}.sp1 small{display:block;font-size:12px}
.fl{position:absolute;font-weight:700;pointer-events:none;animation:up .9s forwards;text-shadow:0 1px 2px #fff}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#log{height:150px;overflow:auto;font-size:13px}#log div{padding:1px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs button{flex:1 1 20%;padding:6px 2px;font-size:13px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cls button{padding:12px 4px}
.cls b{font-size:30px;display:block}
</style></head><body><div id="app"></div>
